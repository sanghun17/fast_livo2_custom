common:
  img_topic: "/camera/color/image_raw_10hz"      # 10Hz throttle in d435i.launch (full-rate: /camera/color/image_raw)
  lid_topic: "/camera/depth/color/points_10hz"   # 10Hz throttle in d435i.launch; PointCloud2 from aligned depth
  imu_topic: "/camera/imu"  # Combined IMU topic (gyro + accel)
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
  # --- Online camera intrinsics ---------------------------------------------
  # At startup FAST-LIVO grabs ONE CameraInfo msg from cam_info_topic in C++
  # (ros::topic::waitForMessage in LIVMapper::initializeComponents) and builds the
  # camera model from it, so intrinsics always match whatever resolution the camera
  # actually came up at. Falls back to camera_d435i.yaml if no msg within timeout.
  # NOTE: img_topic above is the 10Hz throttle, but camera_info is full-rate and
  # NOT throttled -> point cam_info_topic at the un-throttled /camera/color/camera_info.
  online_intrinsics_en: true
  cam_info_topic: "/camera/color/camera_info"
  cam_info_timeout: 5.0
  # Preserve frames whose callback beats the first point cloud; sensor-time
  # synchronization decides whether they are usable. Queue remains bounded.
  img_input_queue_max: 64

# Read-only diagnostics for offline visual-quality analysis.  Keep disabled in
# flight: enabling it writes every processed image frame and active visual patch
# to <prefix>_{frames,points}.csv and adds disk/eigendecomposition overhead.
debug:
  visual_quality_log: false
  visual_quality_output_prefix: "/tmp/fast_livo_visual_quality"
  visual_quality_flush_every_n_frames: 10

# ===========================================================================
# Intel RealSense D435i  (serial 923322070596) on Jetson Orin AGX
# Use with camera_d435i.yaml (intrinsics @640x480, captured 2026-06-01).
#
# HARDWARE NOTE: when captured, the camera was behind the Orin's onboard
# Realtek USB hub. depth+color stream OK at 640x480, but the IMU
# (/camera/imu) and the RGB pointcloud (/camera/depth/color/points) do NOT
# flow through the hub ("Motion Module force pause", control_transfer EAGAIN).
# FAST-LIVO needs IMU + pointcloud → connect the D435i to a DIRECT root USB3
# port (bypass the hub) before running this. See jetson-port-spec.md §camera.
# ===========================================================================

extrin_calib:
  # IMU<-Depth (Lid_offset_to_IMU). VERIFIED 2026-06-22 against rs-enumerate-devices -c
  # on S/N 923322070596: == -(Depth->Gyro/Accel = [-0.00552,0.0051,0.01174]) to full
  # precision, rotation identity. Factory model-constant lever arm.
  extrinsic_T: [0.00552, -0.0051, -0.01174]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # Depth->Color is required by FAST-LIVO's p_color=Rcl*p_depth+Pcl
  # projection convention. These are the inverse of the factory
  # Color->Depth block and match the accepted multi-flight replay config.
  Rcl: [0.999978, 0.00659742, 0.00021399,
        -0.00659736, 0.999978, -0.000301692,
        -0.000215976, 0.000300274, 1.0]
  Pcl: [0.01438551, 0.0000943, 0.00042120]

# Body(=marker) hand-eye extrinsic for /aft_mapped_to_body (mux vio input) + /aft_mapped_to_optitrack.
# T_cam2body: p_body = R*p_cam + t  (OpenCV cam2gripper; gripper = OptiTrack 'pure' rigid body rigidly
# attached AT the vehicle body). 2026-06-24 ChArUco stop-and-go, 32 inliers, residual 6.9mm/0.64deg.
# Source: tools/fastlivo/_handeye_clean.yaml. Rotation independent of board scale; translation in meters.
body_calib:
  enable: true
  q_cam2body_xyzw: [0.4947, -0.5015, 0.5079, -0.4957]
  t_cam2body: [0.07685, 0.02273, 0.03045]
  gt_avg_sec: 3.0          # average GT over this many sec (startup still window) to latch the optitrack anchor

mocap:
  # Evaluation output only. VIO-local control/planning topics are invariant to
  # this switch; flight candidates override it false for GT isolation.
  anchor_enable: true

# ===========================================================================
# TUNED 2026-06-24 on ml via tools/fastlivo parallel grid (v5..v8, 954 configs,
# bag 2026-06-24-08-53-06-trim, NO-ALIGN pos-RMSE vs OptiTrack, full-coverage only).
# Best valid config = v7 fs015_vox03_v100_be002_pf3_mp50_ga0: posRMSE 0.093m, posMax 0.21m.
# Provenance + full lever->perf table: tools/fastlivo/tune_master.csv.
# CAVEATS: tuned on ONE 48s/5m trajectory (no cross-trajectory validation -> record more bags).
#   Real levers: lidar_time_offset(-5ms), filter_size_surf, voxel_size, img_point_cov(100),
#   dept_err_rel, imu acc/gyr_cov(lo). patch_pyrimid_level MUST stay 4 (=2 makes VIO die mid-flight).
# ===========================================================================
time_offset:
  imu_time_offset: 0.0
  lidar_time_offset: -0.005   # TUNED: strongest single handle (l000=0.508 -> l005=0.282 mean RMSE)
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 3    # TUNED (was 1): mild gain, decimation reduces stereo-depth noise
  filter_size_surf: 0.15  # TUNED (was 0.1): big robustness+accuracy gain (0.05 diverges; 0.15-0.20 best)
  lidar_type: 4  # 0: Standard PointCloud2, 1: Livox
  scan_line: 1
  blind: 0.2  # Minimum depth (D435i min-Z ~0.105m; 0.2 is conservative)

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
  # 2026-08-03 multi-flight campaign: keep visual tracking/map maintenance on
  # every frame, but apply the visual EKF correction only when the immediately
  # preceding LIO update has <=50 effective point-plane features.  This kept
  # VIO's benefit on LiDAR-weak flights without its always-on path inflation.
  # Validated on 9 camera+VIO flight bags at 0.5x and 1.0x: 0/9 catastrophic.
  max_lio_features_for_fusion: 50

imu:
  imu_en: true
  # Bounds sensor-time IMUs retained while waiting for the first LiDAR/image or
  # while the estimator is temporarily backlogged (~20 s at 200 Hz).  Startup
  # samples are not discarded merely because their callback beats LiDAR TCP.
  input_queue_max: 4096
  # Independent bounded copy used only until gravity initialization completes.
  # It prevents the normal synchronizer's callback-sized MeasureGroups from
  # choosing a different first sample. Overflow is fatal; samples never slide.
  init_queue_max: 4096
  # Explicit-anchor replay must receive an IMU immediately before the anchor;
  # this guards against accepting a startup prefix with a silently lost tail.
  init_anchor_max_predecessor_gap_s: 0.02
  # Empty in live flight: latch the first image/LiDAR/IMU full-sync sensor epoch.
  # Offline harnesses set this to a decimal uint64 nanosecond string, avoiding
  # XML-RPC's 32-bit integer limit and floating-point epoch rounding.
  init_anchor_stamp_ns: ""
  # Exact count of finite, strictly timestamp-ordered samples used for the
  # startup gravity/gyro-bias estimate (30 samples ~=0.15 s at 200 Hz).
  # Callback batching no longer changes this count.  A rejected moving window
  # is reported and the estimator waits for the next stationary window.
  imu_int_frame: 30
  init_max_gyr_mean: 0.30        # rad/s, norm of the window mean
  init_max_gyr_std: 0.25         # rad/s, norm of per-axis sample stddev
  init_max_acc_std: 1.50         # m/s^2, norm of per-axis sample stddev
  init_acc_norm_tolerance: 3.00  # m/s^2, allowed |mean(acc)| difference from g
  # Keep the historical zero-bias startup for baseline parity.  Mean-gyro bias
  # estimation is only safe to A/B with a longer, known pre-arm static window.
  init_estimate_gyr_bias: false
  # Initial values - need Allan variance calibration
  acc_cov: 0.1           # TUNED (was 0.5): low IMU-trust (imu=lo) best across grid
  gyr_cov: 0.1           # TUNED (was 0.3)
  # The executable historically hard-coded 0.0001 and ignored these two YAML
  # keys.  The loader now honors them; retain the actual historical runtime
  # value used by the 2026-08-03 nine-bag validation.
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.02          # TUNED (was 0.05): near-flat handle, 0.02 in best config
  dept_err_rel: 0.01      # TUNED (was 0.0): range-proportional depth noise ON helps (0.0 less robust). >0 adds range_var += (dept_err_rel*range)^2
  min_eigen_value: 0.0025
  voxel_size: 0.3         # TUNED (was 0.5): finer map best; >=0.8 diverges
  max_layer: 1            # TUNED (was 2): shallower octree more robust; flat-ish handle
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: true   # measured best-effort ~60-70Hz, planning_odom_mux VIO source
  # The high-rate publisher drains every queued 200 Hz IMU timestamp exactly
  # once. A larger gap invalidates propagation until the next LIO/VIO correction
  # instead of integrating one stale measurement over an unsafe interval.
  imu_prop_max_dt: 0.05
  imu_prop_queue_max: 4096
  imu_prop_correction_queue_max: 256
  # The historical /livo/reinit callback does not atomically clear every map,
  # sensor and propagation buffer.  A ground hard restart is the only supported
  # reset until that contract is rewritten and flight-tested.
  runtime_reinit_enable: false
  gravity_align_en: false  # TUNED (was true): grid best (ga0) = 0.093m vs ga1 0.123m on the test bag.
  # ⚠️ FLIGHT CAVEAT: gravity_align=true was set 2026-06-22 to fix takeoff climb scale (0.74->0.93,
  # accel constrains vertical). The bag-best turns it OFF, but that bag may not stress takeoff climb.
  # If takeoff climb scale regresses, set this back to true (costs ~3cm RMSE on the test trajectory).

publish:
  dense_map_en: true
  pub_effect_point_en: true
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "d435i_test"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1
