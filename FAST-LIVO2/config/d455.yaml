common:
  img_topic: "/camera/color/image_raw"
  lid_topic: "/camera/depth/color/points"  # PointCloud2 from aligned depth
  imu_topic: "/camera/imu"  # Combined IMU topic (gyro + accel)
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # IMU to LiDAR extrinsic (identity for initial test - needs IMU-camera calibration)
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # Depth (LiDAR) to Color (Camera) extrinsic from /camera/extrinsics/depth_to_color
  # rotation: [R11, R12, R13, R21, R22, R23, R31, R32, R33]
  # translation: [tx, ty, tz] in meters
  Rcl: [0.9999914169311523, -0.0033681716304272413, -0.0024070232175290585,
        0.0033591496758162975, 0.9999873638153076, -0.0037424431648105383,
        0.0024195979349315166, 0.003734325524419546, 0.9999901056289673]
  Pcl: [-0.059138223528862, 0.00013354465772863477, 0.0004043241497129202]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 10
  filter_size_surf: 0.25
  lidar_type: 4  # 0: Standard PointCloud2, 1: Livox
  scan_line: 1
  blind: 0.2  # Minimum depth for D455 (0.2m)

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  # Initial values - need Allan variance calibration
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: true
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "d455_test"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1
