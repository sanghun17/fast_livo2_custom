# Camera configuration derived from OpenVINS simulator_stereo_cursor config
# Using left camera (cam0) parameters

cam_model: Pinhole
cam_width: 320
cam_height: 240
scale: 1.0

# Intrinsic parameters for 320x240 (half of 640x480)
# intrinsics: [fx, cx, fy, cy] -> [193.0634765625, 160.0, 193.0634765625, 120.0]
cam_fx: 193.0634765625
cam_fy: 193.0634765625
cam_cx: 160.0
cam_cy: 120.0

# Distortion coefficients from OpenVINS (radtan model)
# distortion_coeffs: [k1, k2, p1, p2]
cam_d0: 0.0  # k1
cam_d1: 0.0  # k2
cam_d2: 0.0  # p1
cam_d3: 0.0  # p2